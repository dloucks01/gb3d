name: Deploy gb3d to Pages

# Publishes the committed, prebuilt site in docs/ to GitHub Pages.
#
# We deliberately do NOT rebuild from source here: love.js packaging is
# non-deterministic (a fresh build produces a different game.data every run),
# so building on CI made each deploy a different payload and the CDN served an
# inconsistent mix across deploys. Instead the site is built + verified locally,
# committed to docs/, and this workflow just uploads that exact directory —
# deterministic, and identical to what "Deploy from a branch → /docs" would
# serve. To refresh the build, run ./build.sh --pages locally and commit docs/.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # enablement turns Pages on (source = GitHub Actions) on the first run
        # without visiting Settings → Pages by hand.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
